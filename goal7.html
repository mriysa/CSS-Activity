<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Combining CSS Selectors</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>  
  <h1>To Do List</h1>
  <h2>Monday</h2>
  <div class="box">
    <p class="done">Do these things today!</p>
    <ul class="list">
      <li>Wash Clothes</li>
      <li class="green">Read</li>
      <li class="green">Maths Questions</li>
    </ul>
  </div>

  <ul>
    <p class="black">Other items</p>
  </ul>
  <p>The best preparation for tomorrow is doing your best today.</p>
</body>

</html>
