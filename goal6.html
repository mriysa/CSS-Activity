<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Goal 6</title>
        <style>
        .box {
            padding: 10px;
            box-sizing: border-box;
            font-family: serif;
        }
        .purple {
            background-color: #700070;
            width: 100%;
        }
        .blue {
            background-color: #0000ff;
        }
        .text {
            margin-bottom: 15px;
        }
        .text:last-child {
            margin-bottom: 0;
        }
        .yellow {
            color: #ffff00;
            font-size: 24px;
            margin-bottom: 8px;
            padding-left: 10px;
        }
        .red {
            background-color: #ff0000;
            color: #ffffff;
            font-size: 24px;
            padding: 15px;
        }
        </style>
    </head>

    <body>
        <div class="box purple">
        <div class="box blue">
            
            <div class="text">
                <div class="yellow">Yellow Text</div>
                <div class="box red">White Text</div>
            </div>

            <div class="text">
                <div class="yellow">Yellow Text</div>
                <div class="box red">White Text</div>
            </div>

        </div>
    </div>
    </body>
</html>
