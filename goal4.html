<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Goal 4</title>
        <style>
            body {
            background-color: #558bef; 
            color: white;
            font-family: serif;
            padding: 40px;
        }
        h1 {
            font-size: 45px;
            margin-top: 0;
        }
        .small {
            color: #ff6a39; 
            font-size: 22px;
        }
        .big {
            font-size: 80px;
            margin: 40px 0;
        }
        .weight {
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .fam {
            font-family: cursive;
            font-size: 28px;
        }
        .text {
            text-align: right;
            font-size: 24px;
            margin-top: 40px;
        }
        </style>
    </head>

    <body>
        <h1>Important CSS Properties</h1>
        <div class="small">Color</div>
        <div class="big">Font Size</div>
        <div class="weight">Font Weight</div>
        <div class="fam">Font Fam</div>
        <div class="text">Text Align</div>
    </body>
</html>
