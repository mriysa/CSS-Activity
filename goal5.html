<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Goal 5</title>
        <style>
            body {
            margin: 40px;
            font-family: sans-serif;
        }
        .box {
            width: 300px;
            height: 300px;
            box-sizing: border-box;
        }
        .top {
            background-color: rgb(0, 128, 0);
            border: 10px solid black;
            padding: 20px; 
            overflow: hidden;
            font-size: 14px;
            line-height: 1.4;
        }
        .middle {
            background-color: #ffd700;
            border-top: 20px solid black;  
            border-right: 10px solid black; 
            border-bottom: 10px solid black;
            border-left: 10px solid black;
           margin-left: 300px; 
        }
        .bottom {
            background-color: #cd5c5c;
            border: 10px solid black;
            margin-top: 0px; 
        }
        </style>
    </head>

    <body>
        <div class="box top">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aliquam at sapien porttitor urna elementum lacinia. In id magna pulvinar, ultricies lorem id, vehicula elit. Aliquam eu luctus nisl, vitae pellentesque magna.
    </div>

    <div class="box middle"></div>

    <div class="box bottom"></div>
    </body>
</html>
